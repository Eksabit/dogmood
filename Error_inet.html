<!--

1xx - Информационные

100 Continue: Сервер получил заголовок запроса и клиент может продолжить отправку тела запроса
101 Switching Protocols: Клиент запросил изменение протокола и сервер согласен на это
102 Processing: Сервер получил запрос и обрабатывает его
103 Early Hints: Сервер отправляет предварительные подсказки о ответе

2xx - Успешные

200 OK: Запрос выполнен успешно
201 Created: Ресурс создан успешно
202 Accepted: Запрос принят для обработки, но еще не обработан
203 Non-Authoritative Information: Сервер вернул информацию, которая не является авторитетной
204 No Content: Запрос выполнен успешно, но нет содержимого для возврата
205 Reset Content: Клиент должен сбросить содержимое
206 Partial Content: Сервер вернул часть содержимого
207 Multi-Status: Сервер вернул несколько статусов
208 Already Reported: Сервер уже сообщил об этом ресурсе
209 IM Used: Сервер использовал метод IM

3xx - Перенаправления

300 Multiple Choices: Клиент может выбрать один из нескольких вариантов
301 Moved Permanently: Ресурс перемещен навсегда
302 Found: Ресурс найден, но находится в другом месте
303 See Other: Клиент должен сделать GET-запрос на другой URL
304 Not Modified: Ресурс не изменен с момента последнего запроса
305 Use Proxy: Клиент должен использовать прокси-сервер
306 Switch Proxy: Клиент должен переключиться на другой прокси-сервер
307 Temporary Redirect: Ресурс временно перемещен
308 Permanent Redirect: Ресурс перемещен навсегда

4xx - Ошибки клиента

400 Bad Request: Запрос неверный или не может быть обработан
401 Unauthorized: Неавторизованный доступ
402 Payment Required: Требуется оплата
403 Forbidden: Доступ запрещен
404 Not Found: Ресурс не найден
405 Method Not Allowed: Метод не поддерживается
406 Not Acceptable: Сервер не может вернуть ответ в формате, который поддерживает клиент
407 Proxy Authentication Required: Требуется аутентификация прокси-сервера
408 Request Timeout: Время ожидания запроса истекло
409 Conflict: Запрос конфликтует с текущим состоянием ресурса
410 Gone: Ресурс удален и не доступен
411 Length Required: Требуется указать длину содержимого
412 Precondition Failed: Предварительное условие не выполнено
413 Payload Too Large: Содержимое слишком велико
414 URI Too Long: URI слишком длинный
415 Unsupported Media Type: Тип медиа не поддерживается
416 Range Not Satisfiable: Диапазон не удовлетворяет запросу
417 Expectation Failed: Ожидание не выполнено
418 I'm a teapot: Сервер является чайником и не может выполнить запрос
421 Misdirected Request: Запрос направлен не в тот сервер
422 Unprocessable Entity: Сущность не может быть обработана
423 Locked: Ресурс заблокирован
424 Failed Dependency: Зависимость не выполнена
425 Too Early: Запрос слишком ранний
426 Upgrade Required: Требуется обновление
428 Precondition Required: Требуется предварительное условие
429 Too Many Requests: Слишком много запросов
431 Request Header Fields Too Large: Заголовки запроса слишком велики
451 Unavailable For Legal Reasons: Ресурс недоступен по юридическим причинам

5xx - Ошибки сервера

500 Internal Server Error: Внутренняя ошибка сервера
501 Not Implemented: Метод не реализован
502 Bad Gateway: Плохой шлюз
503 Service Unavailable: Сервис недоступен
504 Gateway Timeout: Время ожидания шлюза истекло
505 HTTP Version Not Supported: Версия HTTP не поддерж
506 Variant Also Negotiates: Вариант также ведет переговоры
507 Insufficient Storage: Недостаточно места для хранения
508 Loop Detected: Обнаружен цикл
509 Bandwidth Limit Exceeded: Превышен лимит пропускной способности
510 Not Extended: Не расширено
511 Network Authentication Required: Требуется аутентификация сети

6xx - Неисправности сервера

600 Unparseable Response Headers: Заголовки ответа не могут быть проанализированы
601 Misdirected Request: Запрос направлен не в тот сервер
602 Server Internal Error: Внутренняя ошибка сервера
603 Server Internal Error (Gateway): Внутренняя ошибка шлюза
604 Server Internal Error (Proxy): Внутренняя ошибка прокси-сервера

Примечание: Кодов статусов 6xx не существует в официальной спецификации HTTP, 
но они могут использоваться некоторыми серверами или приложениями для обозначения неисправностей сервера.

Другие коды статусов

900 Bad Request: Запрос неверный или не может быть обработан (используется некоторыми серверами)
901 Unauthorized: Неавторизованный доступ (используется некоторыми серверами)
902 Forbidden: Доступ запрещен (используется некоторыми серверами)
903 Not Found: Ресурс не найден (используется некоторыми серверами)
904 Method Not Allowed: Метод не поддерживается (используется некоторыми серверами)
905 Not Acceptable: Сервер не может вернуть ответ в формате, который поддерживает клиент (используется некоторыми серверами)
-->
